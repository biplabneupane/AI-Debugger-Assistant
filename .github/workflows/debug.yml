name: AI Debugger Automation

on: [push, pull_request]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -r requirements.txt
          pip install flake8 anthropic==0.25.0  # ✅ Use a stable Anthropic version

      - name: Verify Flake8 Installation
        run: flake8 --version

      - name: Set Anthropic API Key  # ✅ Ensure API key is loaded before execution
        run: |
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> $GITHUB_ENV
          echo "✅ Anthropic API Key Loaded"

      - name: Run Analyzer
        run: python src/analyzer.py

      - name: Run AI Debugger
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/ai_debugger.py

      - name: Apply Fixes
        run: python src/auto_fixer.py

      - name: Push Fixes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated AI fixes"
          git push origin main || echo "No changes to push"
