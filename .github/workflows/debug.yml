name: AI Debugger Automation

on: [push, pull_request]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -r requirements.txt
          pip install flake8 openai

      - name: Verify Flake8 Installation
        run: flake8 --version

      - name: Run Analyzer
        run: python src/analyzer.py

      - name: Run AI Debugger
        run: python src/ai_debugger.py

      - name: Apply Fixes
        run: python src/auto_fixer.py

      - name: Push Fixes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add .
          git commit -m "Automated AI fixes" || echo "No changes to commit"
          git push origin main || echo "No changes to push"
